<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up | ScamShield</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-[#07111f] text-white min-h-screen relative overflow-x-hidden flex flex-col justify-between">

    <!-- NAVBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto">
            <div class="nav-glass flex items-center justify-between px-6 py-4 rounded-2xl">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="logo-shield">🛡️</div>
                    <div>
                        <h1 class="font-bold text-lg tracking-wide">
                            Scam<span class="text-cyan-400">Shield</span>
                        </h1>
                        <p class="text-[10px] text-slate-400 tracking-widest uppercase">
                            Trust Before You Apply
                        </p>
                    </div>
                </a>
                <a href="index.html" class="nav-link text-sm text-slate-400 hover:text-cyan-400 transition">
                    ← Back to Home
                </a>
            </div>
        </div>
    </nav>

    <!-- BACKGROUND GLOWS -->
    <div class="hero-glow glow-one"></div>
    <div class="hero-glow glow-two"></div>

    <!-- MAIN CONTENT -->
    <main class="pt-32 pb-20 px-6 flex-1 flex items-center justify-center relative z-10">
        <div class="w-full max-w-md">
            
            <!-- BRAND HEADER -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-cyan-400/10 border border-cyan-400/20 text-cyan-300 text-xs font-semibold mb-4">
                    <span class="pulse-dot"></span> Secure ScamShield Account
                </div>
                <h2 class="text-3xl font-extrabold tracking-tight">
                    Welcome to <span class="gradient-text">ScamShield</span>
                </h2>
                <p class="text-slate-400 text-xs mt-2">
                    Protect your career, verify offers, and track reported scams.
                </p>
            </div>

            <!-- AUTH CARD -->
            <div class="analyzer-card p-7 md:p-9 rounded-3xl border border-slate-800 bg-[#0d1d30]/90 backdrop-blur-xl shadow-2xl">
                
                <!-- TABS -->
                <div class="flex bg-slate-900/80 p-1.5 rounded-2xl mb-6 border border-slate-800">
                    <button type="button" id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-cyan-500 text-slate-950 transition shadow">
                        Sign In
                    </button>
                    <button type="button" id="tabSignup" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition">
                        Sign Up
                    </button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                        <input type="email" id="loginEmail" required placeholder="student@university.edu" class="w-full rounded-xl border border-slate-700 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 transition">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="text-xs font-semibold text-slate-300">Password</label>
                            <a href="#" onclick="alert('Demo Mode: Enter any password to continue.')" class="text-[11px] text-cyan-400 hover:underline">Forgot password?</a>
                        </div>
                        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full rounded-xl border border-slate-700 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Account Role</label>
                        <select id="loginRole" class="w-full rounded-xl border border-slate-700 bg-slate-900/70 px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                            <option value="Student">👨‍🎓 Student / Job Seeker</option>
                            <option value="Recruiter">💼 HR / Recruiter</option>
                            <option value="Institution">🏫 Educational Institute</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-xs text-white shadow-lg shadow-cyan-500/25 hover:brightness-110 transition mt-2">
                        Sign In to ScamShield
                    </button>
                </form>

                <!-- SIGNUP FORM (Hidden by default) -->
                <form id="signupForm" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
                        <input type="text" id="signupName" required placeholder="Alex Rivera" class="w-full rounded-xl border border-slate-700 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                        <input type="email" id="signupEmail" required placeholder="alex.rivera@university.edu" class="w-full rounded-xl border border-slate-700 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Create Password</label>
                        <input type="password" id="signupPassword" required placeholder="Minimum 6 characters" class="w-full rounded-xl border border-slate-700 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Account Role</label>
                        <select id="signupRole" class="w-full rounded-xl border border-slate-700 bg-slate-900/70 px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                            <option value="Student">👨‍🎓 Student / Job Seeker</option>
                            <option value="Recruiter">💼 HR / Recruiter</option>
                            <option value="Institution">🏫 Educational Institute</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-xs text-white shadow-lg shadow-cyan-500/25 hover:brightness-110 transition mt-2">
                        Create ScamShield Account
                    </button>
                </form>

                <!-- DEMO LOGIN QUICK ACTIONS -->
                <div class="mt-6 pt-6 border-t border-slate-800">
                    <p class="text-[11px] text-slate-400 text-center font-semibold mb-3">Or quick login with demo profile:</p>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button type="button" onclick="demoLogin('student')" class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-[11px] font-semibold text-slate-300 hover:border-cyan-400 hover:text-cyan-300 transition text-center">
                            ⚡ Student Demo
                        </button>
                        <button type="button" onclick="demoLogin('recruiter')" class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-[11px] font-semibold text-slate-300 hover:border-cyan-400 hover:text-cyan-300 transition text-center">
                            ⚡ Recruiter Demo
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-slate-800/60 text-center text-xs text-slate-500 relative z-10">
        ScamShield — AI-Powered Job & Internship Scam Detection.
    </footer>

    <!-- JS -->
    <script src="js/auth.js"></script>
    <script>
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl bg-cyan-500 text-slate-950 transition shadow';
                tabSignup.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition';
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabSignup.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl bg-cyan-500 text-slate-950 transition shadow';
                tabLogin.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;

            const res = ScamShieldAuth.login(email, pass, role);
            if (res.success) {
                alert(`Welcome back, ${res.user.name}!`);
                window.location.href = 'index.html';
            } else {
                alert(res.message);
            }
        });

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPassword').value;
            const role = document.getElementById('signupRole').value;

            const res = ScamShieldAuth.signup(name, email, pass, role);
            if (res.success) {
                alert(`Account created successfully! Welcome to ScamShield, ${res.user.name}.`);
                window.location.href = 'index.html';
            } else {
                alert(res.message);
            }
        });

        function demoLogin(type) {
            if (type === 'student') {
                ScamShieldAuth.login('alex.rivera@student.edu', 'demo123', 'Student');
                alert('Signed in as Student Demo (Alex Rivera)');
            } else {
                ScamShieldAuth.login('sarah.hr@techcorp.com', 'demo123', 'Recruiter');
                alert('Signed in as Recruiter Demo (Sarah HR)');
            }
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
